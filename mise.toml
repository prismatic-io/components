[tools]
awscli = "2.33.3"
bun = "1.3.6"
github-cli = "2.79.0"
jq = "1.8.1"

# Node.js with npm upgrade postinstall
[tools.nodejs]
version = "22.23.4"
postinstall = """
  npm install --global npm@^11.15.0
  npm install --global @prismatic-io/prism@^9
  npm install --global @prismatic-io/spectral@^10
"""

[tasks.release]
description = "Start the npm publish workflow, which publishes each version in npm-api/manifest.json that npm does not have"
usage = '''
flag "--dry-run" help="Pack and report without publishing"
'''
run = """
dry_run=$([ "$usage_dry_run" = "true" ] && echo true || echo false)
gh workflow run npm-publish.yml --repo prismatic-io/components --ref main -f dry_run=$dry_run
echo "Publish workflow started (dry_run=$dry_run): https://github.com/prismatic-io/components/actions/workflows/npm-publish.yml"
"""

[tasks.publish-first]
description = "Publish npm-ready components' first versions and make the publish workflow their trusted publisher"
usage = '''
arg "[component]" var=#true help="Each component's directory under components/"
flag "--all" help="Every component in npm-api/manifest.json that npm has never seen"
flag "--dry-run" help="Check and pack without publishing"
'''
run = """
bun install --cwd .github/scripts --frozen-lockfile --silent
bun .github/scripts/publish-first.ts $usage_component \\
  $([ "$usage_all" = "true" ] && echo --all) $([ "$usage_dry_run" = "true" ] && echo --dry-run)
"""
