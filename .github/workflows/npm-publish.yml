# Publishes the npm packages of npm-ready components. Versions are recorded in
# npm-api/manifest.json; .github/scripts/npm-publish.ts publishes whatever the
# manifest lists that npm does not have yet. Every version change rewrites the
# manifest, hence the paths filter.
#
# A developer creates each package on npm, from main, with
# `mise run publish-first <component>`: it publishes 0.0.1, makes this
# workflow the package's trusted publisher, and starts this workflow, which
# publishes the manifest's version. This workflow skips packages npm has
# never seen, with a warning, and checks that each other package has a
# trusted publisher naming this workflow before building it.
#
# A real publish that fails posts to Slack.
#
# Start it by hand with `mise run release`, or `mise run release --dry-run` to
# see what would publish. Only main publishes; a dry run works from any branch. To pause publishing,
# disable the workflow from the Actions tab.
name: Publish npm packages

on:
  push:
    branches: [main]
    paths: [npm-api/manifest.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and report without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pushes come only from main, but a manual run can pick any branch, and
      # checkout takes that branch: only main publishes for real.
      - if: github.ref != 'refs/heads/main' && !inputs.dry_run
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::Only main publishes; run $REF with dry_run to see what it would publish."
          exit 1
      - uses: actions/checkout@v4
      # Node builds and publishes the components; Bun runs the publish script.
      # Versions match mise.toml.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      # Trusted publishing (OIDC, no npm token) needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile
        working-directory: .github/scripts
      - run: bun test
        working-directory: .github/scripts
      # A hung publish fails at the timeout rather than at the job's, which would cancel
      # the job and skip the notification below. A full publish takes about 15 minutes.
      - run: bun .github/scripts/npm-publish.ts ${{ inputs.dry_run && '--dry-run' || '' }}
        timeout-minutes: 60
      - name: Notify Slack of the failure
        if: failure() && github.ref == 'refs/heads/main' && !inputs.dry_run
        timeout-minutes: 1
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set; not notifying Slack."
            exit 0
          fi
          text=$(printf ':x: npm publish failed for %s (%s by %s, %s)\n<%s|View the run>' \
            "$REPOSITORY" "$EVENT" "$ACTOR" "${SHA:0:7}" "$RUN_URL")
          body=$(jq -n --arg text "$text" '{text: $text}')
          curl --silent --show-error --fail --max-time 10 --retry 2 \
            -H 'Content-Type: application/json' --data "$body" "$SLACK_WEBHOOK_URL"
