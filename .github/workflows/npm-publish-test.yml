# Tests and typechecks the npm publish script on pull requests that change it.
name: Test npm publish script

on:
  pull_request:
    paths: [.github/scripts/**, .github/workflows/npm-publish*.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
